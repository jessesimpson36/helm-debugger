name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: toolchain
        run: |
          set -euo pipefail
          set -a
          . ./toolchain.env
          set +a
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
      - name: Build
        run: make build
      - name: Report version metadata
        run: ./helm-debugger --version
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -short ./...

  docker:
    # arm64 runs natively on GitHub's arm64 runner; this is what makes Delve's
    # ptrace work for Apple Silicon users, so exercise it here too.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic image
        run: make docker-build IMAGE=helm-debugger:ci
      - name: Verify image metadata
        run: |
          docker run --rm helm-debugger:ci --version
          docker inspect helm-debugger:ci \
            --format '{{ index .Config.Labels "io.helm-debugger.helm.version" }} / {{ index .Config.Labels "io.helm-debugger.delve.version" }}'
      - name: Smoke test the debugger in the image
        run: |
          docker run --rm --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -v "$PWD:/workspace" -w /workspace helm-debugger:ci \
            --mode model --helm-path helm --chart test --values image.tag \
            --extra-command-args '--show-only templates/deployment.yaml'
