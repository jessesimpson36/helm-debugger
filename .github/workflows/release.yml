name: Release

# Pushing a semver tag (v0.1.0, v0.2.0-rc.1, ...) cuts a release. Manual runs
# are for re-cutting a release or publishing from a branch; they need a version
# input. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  actions: write  # buildx gha cache
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository }}
  IMAGE_DOCKERHUB: docker.io/jessesimpson/helm-debugger
  # Keep in sync with the image matrix below. These run natively (no QEMU), so
  # Apple Silicon Macs pull a native linux/arm64 image and Delve's ptrace works.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Resolve the release version and the pinned toolchain from one place so the
  # image, SBOMs and metadata all describe the same build.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      build_date: ${{ steps.build_date.outputs.build_date }}
      go_version: ${{ steps.toolchain.outputs.go_version }}
      helm_version: ${{ steps.toolchain.outputs.helm_version }}
      delve_version: ${{ steps.toolchain.outputs.delve_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: toolchain
        run: |
          set -euo pipefail
          # toolchain.env is valid shell as well as make.
          set -a
          . ./toolchain.env
          set +a
          {
            echo "go_version=${GO_VERSION}"
            echo "helm_version=${HELM_VERSION}"
            echo "delve_version=${DELVE_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - name: Build date
        id: build_date
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi
          case "$version" in
            v*) ;;
            *) version="v${version}" ;;
          esac
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (prerelease=${prerelease})"

  # SBOM for the source tree (Go modules, vendored files, workflows).
  sbom-source:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: helm-debugger-${{ needs.prepare.outputs.version }}-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: helm-debugger-${{ needs.prepare.outputs.version }}-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload source SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: source-sbom
          path: |
            helm-debugger-${{ needs.prepare.outputs.version }}-source.spdx.json
            helm-debugger-${{ needs.prepare.outputs.version }}-source.cdx.json
          if-no-files-found: error

  # Build each platform on its own native runner (arm64 on ubuntu-24.04-arm, so
  # no QEMU) and push it by digest. The merge job assembles the manifest list.
  image:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ needs.prepare.outputs.go_version }}
            HELM_VERSION=${{ needs.prepare.outputs.helm_version }}
            DELVE_VERSION=${{ needs.prepare.outputs.delve_version }}
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          outputs: type=image,name=${{ env.IMAGE_GHCR }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_GHCR }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: helm-debugger-${{ needs.prepare.outputs.version }}-image-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_GHCR }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: helm-debugger-${{ needs.prepare.outputs.version }}-image-${{ matrix.arch }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom-${{ matrix.arch }}
          path: |
            helm-debugger-${{ needs.prepare.outputs.version }}-image-${{ matrix.arch }}.spdx.json
            helm-debugger-${{ needs.prepare.outputs.version }}-image-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  # Assemble the per-platform images into one manifest list and publish every
  # tag. GHCR is the source of blobs; Docker Hub is mirrored by imagetools.
  merge:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      dockerhub: ${{ steps.tags.outputs.dockerhub }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          numeric="${version#v}"
          prerelease="${{ needs.prepare.outputs.prerelease }}"
          dockerhub=false
          [ -n "${DOCKERHUB_TOKEN:-}" ] && dockerhub=true

          helm_ver="${{ needs.prepare.outputs.helm_version }}"
          delve_ver="${{ needs.prepare.outputs.delve_version }}"
          toolchain="go${{ needs.prepare.outputs.go_version }}-helm${helm_ver#v}-delve${delve_ver#v}"

          tags=""
          add() {
            if [ -z "$tags" ]; then tags="$1"; else tags="${tags}"$'\n'"$1"; fi
          }

          add "${IMAGE_GHCR}:${version}"
          add "${IMAGE_GHCR}:${numeric}"
          add "${IMAGE_GHCR}:${toolchain}"
          if [ "$dockerhub" = "true" ]; then
            add "${IMAGE_DOCKERHUB}:${version}"
            add "${IMAGE_DOCKERHUB}:${numeric}"
            add "${IMAGE_DOCKERHUB}:${toolchain}"
          fi

          if [ "$prerelease" = "false" ]; then
            major_minor="${numeric%.*}"
            major="${numeric%%.*}"
            add "${IMAGE_GHCR}:${major_minor}"
            add "${IMAGE_GHCR}:${major}"
            add "${IMAGE_GHCR}:latest"
            if [ "$dockerhub" = "true" ]; then
              add "${IMAGE_DOCKERHUB}:${major_minor}"
              add "${IMAGE_DOCKERHUB}:${major}"
              add "${IMAGE_DOCKERHUB}:latest"
            fi
          fi

          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "dockerhub=${dockerhub}"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest and push
        id: create
        run: |
          set -euo pipefail
          cd /tmp/digests
          sources=()
          for f in *; do sources+=("${IMAGE_GHCR}@sha256:${f}"); done
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "${{ steps.tags.outputs.tags }}"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Resolve published digest
        id: digest
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          digest=$(docker buildx imagetools inspect "${IMAGE_GHCR}:${version}" --format '{{.Manifest.Digest}}' | tr -d '\n')
          if [ -z "$digest" ]; then
            echo "could not resolve published image digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE_GHCR}:${version} -> ${digest}"
          docker buildx imagetools inspect "${IMAGE_GHCR}:${version}"

      - name: Attest multi-arch image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_GHCR }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # Publish the GitHub release with the SBOMs, build metadata, checksums and
  # the canonical MCP configuration for this version.
  release:
    needs: [prepare, merge, sbom-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Only our SBOM artifacts. The buildx `type=gha` cache and digest
          # artifacts also show up and must not be fetched here.
          pattern: "*-sbom*"
          path: artifacts
          merge-multiple: true
      - name: Assemble release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
          GO_VERSION: ${{ needs.prepare.outputs.go_version }}
          HELM_VERSION: ${{ needs.prepare.outputs.helm_version }}
          DELVE_VERSION: ${{ needs.prepare.outputs.delve_version }}
          IMAGE_DIGEST: ${{ needs.merge.outputs.digest }}
          DOCKERHUB_ENABLED: ${{ needs.merge.outputs.dockerhub }}
          PLATFORMS: ${{ env.PLATFORMS }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp -v artifacts/* release/
          cp -v packaging/install-mcp.sh release/install-mcp.sh

          VERSION="$VERSION" \
          COMMIT="$COMMIT" \
          BUILD_DATE="${{ needs.prepare.outputs.build_date }}" \
          GO_VERSION="$GO_VERSION" \
          HELM_VERSION="$HELM_VERSION" \
          DELVE_VERSION="$DELVE_VERSION" \
          IMAGE="${IMAGE_GHCR}:${VERSION}" \
          IMAGE_DIGEST="$IMAGE_DIGEST" \
          PLATFORMS="$PLATFORMS" \
          SBOM_SOURCE="helm-debugger-${VERSION}-source.spdx.json,helm-debugger-${VERSION}-source.cdx.json" \
          SBOM_IMAGE="$(ls artifacts/helm-debugger-*-image-*.spdx.json artifacts/helm-debugger-*-image-*.cdx.json | sed 's|artifacts/||' | paste -sd, -)" \
            ./scripts/release-metadata.sh > release/metadata.json

          sed "s|__IMAGE__|${IMAGE_GHCR}:${VERSION}|" packaging/opencode.mcp.json > release/opencode-ghcr.json
          for h in claude cursor vscode; do
            sed "s|__IMAGE__|${IMAGE_GHCR}:${VERSION}|" "packaging/$h.mcp.json" > "release/${h}-ghcr.json"
            if [ "$DOCKERHUB_ENABLED" = "true" ]; then
              sed "s|__IMAGE__|${IMAGE_DOCKERHUB}:${VERSION}|" "packaging/$h.mcp.json" > "release/${h}-dockerhub.json"
            fi
          done
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            sed "s|__IMAGE__|${IMAGE_DOCKERHUB}:${VERSION}|" packaging/opencode.mcp.json > release/opencode-dockerhub.json
          fi

          ( cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
              | sort | xargs sha256sum > SHA256SUMS )

          echo "--- release assets ---"
          ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
